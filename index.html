<script>
  (function () {

      var atBottom = window.scrollY + window.innerHeight >= doc.scrollHeight - 20;

/* ------------------------------ ฟังก์ชันช่วย ------------------------------ */

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function toBuddhistYear(gYear) {
  return gYear + 543;
}

function formatThaiDateShort(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getDate()} ${MONTHS_TH_SHORT[d.getMonth()]} ${toBuddhistYear(d.getFullYear())}`;
}

function pad2(n) {
  return n.toString().padStart(2, "0");
}

function dateToKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

// คำนวณสถานะของงานจากวันเวลาครบกำหนด เทียบกับเวลาปัจจุบัน
function getTaskStatus(task, now = new Date()) {
  if (task.completed) return "done";
  const due = new Date(`${task.dueDate}T${task.dueTime || "23:59"}:00`);
  const diffH = (due - now) / 36e5;
  if (diffH < 0) return "overdue";
  if (diffH <= 24) return "urgent";
  if (diffH <= 24 * 3) return "soon";
  return "chill";
}

function formatRemaining(task, now = new Date()) {
  const due = new Date(`${task.dueDate}T${task.dueTime || "23:59"}:00`);
  const diffMs = due - now;
  if (diffMs < 0) return "เลยกำหนดแล้ว";
  const diffH = diffMs / 36e5;
  if (diffH < 1) return `เหลือ ${Math.max(1, Math.round(diffMs / 60000))} นาที`;
  if (diffH < 24) return `เหลือ ${Math.round(diffH)} ชม.`;
  return `เหลืออีก ${Math.round(diffH / 24)} วัน`;
}

// คำนวณช่วงวันที่ของ "สัปดาห์นี้ / เดือนนี้ / ปีนี้" อิงจากวันนี้
function getPeriodRange(period, ref = new Date()) {
  const start = new Date(ref);
  const end = new Date(ref);
  if (period === "week") {
    const day = start.getDay(); // 0=อาทิตย์ ... 6=เสาร์
    start.setDate(start.getDate() - day); // ถอยกลับไปวันอาทิตย์ของสัปดาห์นี้
    start.setHours(0, 0, 0, 0);
    end.setTime(start.getTime());
    end.setDate(end.getDate() + 6); // วันเสาร์
    end.setHours(23, 59, 59, 999);
  } else if (period === "month") {
    start.setDate(1);
    start.setHours(0, 0, 0, 0);
    end.setMonth(end.getMonth() + 1, 0);
    end.setHours(23, 59, 59, 999);
  } else {
    start.setMonth(0, 1);
    start.setHours(0, 0, 0, 0);
    end.setMonth(11, 31);
    end.setHours(23, 59, 59, 999);
  }
  return { start, end };
}

/* ------------------------------ Storage layer ------------------------------ */
/* หน้าเว็บนี้โฮสต์แยกต่างหาก (เช่น GitHub Pages) จึงเรียก Apps Script ผ่าน
   fetch() แบบ JSON RPC แทน google.script.run (ซึ่งใช้ได้เฉพาะตอนเปิดจาก
   Apps Script เองเท่านั้น) — นำ URL ที่ได้จากขั้นตอน Deploy มาใส่ตรง API_URL */

const API_URL = "https://script.google.com/macros/s/AKfycbzmfyrioKWjb_uDUE7P1XkRnAWck2bcY5mFDfDZBZ7u0rVvAb7CAFoCDHexywrAPOg0OA/exec";

const PROFILE_KEY_PREFIX = "deadhoot:profile:";
const DATA_KEY_PREFIX = "deadhoot:data:";
const LOCAL_EMAIL_KEY = "deadhoot_local_email";

function profileKeyFor(email) {
  return PROFILE_KEY_PREFIX + email.trim().toLowerCase();
}
function dataKeyFor(email) {
  return DATA_KEY_PREFIX + email.trim().toLowerCase();
}

// จำอีเมลของผู้ใช้ไว้ในเครื่อง (เบราว์เซอร์นี้) เพื่อให้รู้ว่าตอนเปิดแอปครั้งถัดไป
// ควรไปโหลดข้อมูลของใครกลับมาจากชีท (แยกกันคนละแถวตามอีเมล)
function getLocalEmail() {
  try {
    return localStorage.getItem(LOCAL_EMAIL_KEY);
  } catch (e) {
    return null;
  }
}
function setLocalEmail(email) {
  try {
    localStorage.setItem(LOCAL_EMAIL_KEY, email.trim().toLowerCase());
  } catch (e) {
    console.error("save local email failed", e);
  }
}
function clearLocalEmail() {
  try {
    localStorage.removeItem(LOCAL_EMAIL_KEY);
  } catch (e) {
    console.error("clear local email failed", e);
  }
}

// เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์ (Code.gs) ข้ามโดเมนผ่าน fetch() แบบ GET
// เหตุผลที่ใช้ GET ไม่ใช้ POST: Apps Script Web App จะแนบ Access-Control-Allow-Origin
// ให้เฉพาะ response ของ GET เท่านั้น ถ้าใช้ POST เบราว์เซอร์จะยิงถึงเซิร์ฟเวอร์จริง
// (เขียนข้อมูลสำเร็จ) แต่จะบล็อกไม่ให้ฝั่งเว็บอ่านผลลัพธ์กลับมา ทำให้ดูเหมือน "เชื่อมต่อไม่สำเร็จ"
async function callServer(fnName, ...args) {
  const url = `${API_URL}?fn=${encodeURIComponent(fnName)}&args=${encodeURIComponent(JSON.stringify(args))}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.error) {
    throw new Error(json.error);
  }
  return json.result;
}

// ยิงเขียนข้อมูลแบบ POST + no-cors (ใช้กับข้อมูลก้อนใหญ่ เช่น รูปโปรไฟล์ ที่ยัดใน URL ของ GET ไม่พอ)
// โหมด no-cors ทำให้อ่าน response กลับไม่ได้ แต่คำขอจะไปถึงเซิร์ฟเวอร์และเขียนข้อมูลสำเร็จจริง
async function callServerWrite(fnName, ...args) {
  await fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ fn: fnName, args: args }),
  });
  return true;
}

function storageGet(key) {
  return callServer("getValue", key)
    .then((raw) => (raw != null ? JSON.parse(raw) : null))
    .catch((err) => {
      console.error("storage get failed", err);
      return null;
    });
}

function storageSet(key, value) {
  return callServerWrite("setValue", key, JSON.stringify(value))
    .then(() => true)
    .catch((err) => {
      console.error("storage set failed", err);
      return false;
    });
}

// ย่อ/บีบอัดรูปที่ผู้ใช้เลือกจากเครื่องให้เล็กพอจะเก็บใน Google Sheet ได้ (คืนค่าเป็น base64 dataURL)
function resizeImageFile(file, maxSize = 240, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("โหลดรูปไม่สำเร็จ"));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      <span>{`${h % 12 === 0 ? 12 : h % 12}:${pad2(m)}`}</span>
      <span className="tracking-wide">●●● 100%</span>
    </div>
  );
}

  const toggleRemind = (d) => {
    setRemind((r) => (r.includes(d) ? r.filter((x) => x !== d) : [...r, d].sort((a, b) => b - a)));
  };

  const handleSave = () => {
    if (!title.trim()) {
      setError("กรุณากรอกชื่องาน");
      scrollRef.current?.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (!subjectId) {
      setError("กรุณาเลือกวิชา");
      scrollRef.current?.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (Number(estimatedHours) < 0 || Number.isNaN(Number(estimatedHours))) {
      setError("เวลาที่คาดว่าจะใช้ต้องเป็น 0 หรือมากกว่า");
      scrollRef.current?.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    setError("");
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      subjectId,
      dueDate,
      dueTime,
      importance,
      estimatedHours: Number(estimatedHours) || 0,
      remind,
      completed: initial?.completed || false,
    });
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-2 px-4 pt-2">
        <button onClick={onCancel} className="p-2 -ml-2 text-gray-500">
          <ChevronLeft size={22} />

      </div>
      <div
        className="mx-4 mt-1 rounded-3xl p-5 flex items-center justify-between text-white"
        style={{ background: `linear-gradient(135deg, ${theme.primary}, ${theme.dark})` }}

        <div>
          <div className="text-lg font-bold">{initial ? "แก้ไขงาน" : "+ เพิ่มงานใหม่"}</div>
          <div className="text-sm opacity-90 mt-1">กรอกให้ฮูกช่วยจำแทนคุณ</div>
        </div>
        <OwlAvatar mood="happy" size={56} />
      </div>

      <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 mt-4 flex flex-col gap-3 pb-4">
        {error && (
          <div className="bg-red-50 border border-red-200 text-red-600 text-sm rounded-2xl p-3">{error}</div>
        )}

        <div className="bg-white rounded-2xl border border-gray-100 p-4">
          <label className="text-sm font-medium text-gray-500">📝 ชื่องาน</label>
          <input
            value={title}
            onChange={(e) => {
              setTitle(e.target.value);
              if (error) setError("");
            }}
            placeholder="รายงานวิเคราะห์ข้อมูล..."
            className="w-full mt-1 text-gray-800 focus:outline-none"
          />
        </div>

        <div className="bg-white rounded-2xl border border-gray-100 p-4">
          <label className="text-sm font-medium text-gray-500">📖 วิชา</label>
          <select
            value={subjectId}
            onChange={(e) => {
              setSubjectId(e.target.value);
              if (error) setError("");
            }}
            className="w-full mt-1 text-gray-800 bg-transparent focus:outline-none"
          >
            {subjects.map((s) => (
              <option key={s.id} value={s.id}>
                {s.code} - {s.name}
              </option>
            ))}
          </select>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div className="bg-white rounded-2xl border border-gray-100 p-4">
            <label className="text-sm font-medium text-gray-500">📅 วันครบกำหนด</label>
            <input
              type="date"
              value={dueDate}
              onChange={(e) => setDueDate(e.target.value)}
              className="w-full mt-1 text-gray-800 focus:outline-none bg-transparent"
            />
          </div>
          <div className="bg-white rounded-2xl border border-gray-100 p-4">
            <label className="text-sm font-medium text-gray-500">⏰ เวลา</label>
            <input
              type="time"
              value={dueTime}
              onChange={(e) => setDueTime(e.target.value)}
              className="w-full mt-1 text-gray-800 focus:outline-none bg-transparent"
            />
          </div>
        </div>

        <div className="bg-white rounded-2xl border border-gray-100 p-4">
          <label className="text-sm font-medium text-gray-500">⭐ ความสำคัญ</label>
          <div className="flex items-center gap-2 mt-2">
            {[1, 2, 3].map((lvl) => (
              <button
                key={lvl}
                onClick={() => setImportance(lvl)}
                className="w-5 h-5 rounded-full border-2"
                style={{

                }}
                aria-label={`ระดับความสำคัญ ${lvl}`}
              />
            ))}
            <span className="text-xs text-gray-400 ml-2">
              {importance === 1 ? "ต่ำ" : importance === 2 ? "ปานกลาง" : "สูง"}
            </span>
          </div>
        </div>

        <div className="bg-white rounded-2xl border border-gray-100 p-4">
          <label className="text-sm font-medium text-gray-500">⏳ เวลาที่คาดว่าจะใช้ (ชั่วโมง)</label>
          <input
            type="number"
            min="0"
            step="0.5"

              <button
                key={d}

                style={{
                  borderColor: theme.primary,
                  color: remind.includes(d) ? "white" : theme.primary,

function ResultScreen({ theme, tasks, subjects, onViewCalendar, onViewProgress, onBackHome }) {
  const total = tasks.length || 1;
  const done = tasks.filter((t) => t.completed).length;
  const percent = Math.round((done / total) * 100);

  const incomplete = tasks.filter((t) => !t.completed);
  const nearest = [...incomplete].sort(
    (a, b) => new Date(`${a.dueDate}T${a.dueTime || "23:59"}`) - new Date(`${b.dueDate}T${b.dueTime || "23:59"}`)
  )[0];
  const nearestSubject = subjects.find((s) => s.id === nearest?.subjectId);

  const now = new Date();
  const in7 = new Date(now);
  in7.setDate(in7.getDate() + 7);
  const in14 = new Date(now);
  in14.setDate(in14.getDate() + 14);
  const nextWeekTasks = incomplete.filter((t) => {
    const due = new Date(`${t.dueDate}T${t.dueTime || "23:59"}`);

        <div className="text-sm font-bold text-gray-700 mb-2">📊 ภาพรวมสัปดาห์นี้</div>
        <div className="bg-white rounded-2xl border border-gray-100 p-4">

          <div className="w-full bg-gray-100 rounded-full h-2">

        <div className="w-1.5 rounded-full" style={{ background: "#34D399" }} />
        <div>
          <div className="font-semibold text-gray-800">สัปดาห์หน้า</div>

/* ------------------------------ Calendar ------------------------------ */

function CalendarScreen({ theme, tasks, subjects, onToggle, onEdit, onDelete, current, onNavigate }) {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selected, setSelected] = useState(dateToKey(today));

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  const tasksByDate = {};
  tasks.forEach((t) => {
    if (!tasksByDate[t.dueDate]) tasksByDate[t.dueDate] = [];
    tasksByDate[t.dueDate].push(t);
  });

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const changeMonth = (delta) => {
    let m = viewMonth + delta;
    let y = viewYear;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setViewMonth(m);
    setViewYear(y);
    setSelected(`${y}-${pad2(m + 1)}-01`); // กันไม่ให้ panel ล่างค้างวันที่ของเดือนก่อนหน้า
  };

  const subjectById = Object.fromEntries(subjects.map((s) => [s.id, s]));
  const selectedTasks = (tasksByDate[selected] || []).sort((a, b) => (a.dueTime || "").localeCompare(b.dueTime || ""));

  return (
    <div className="flex flex-col h-full">
      <GradientHeader theme={theme} title="📅 ปฏิทิน" subtitle="ดูงานทั้งหมดของคุณในเดือนนี้" mood="neutral" />

      <div className="px-4 mt-4 flex items-center justify-between">
        <button onClick={() => changeMonth(-1)} className="p-2 text-gray-400">
          <ChevronLeft size={20} />
        </button>
        <div className="font-bold text-gray-700">
          {MONTHS_TH_FULL[viewMonth]} {toBuddhistYear(viewYear)}
        </div>
        <button onClick={() => changeMonth(1)} className="p-2 text-gray-400">
          <ChevronRight size={20} />
        </button>
      </div>

      <div className="px-4 mt-3 grid grid-cols-7 gap-1 text-center text-xs text-gray-400">
        {WEEKDAYS_TH.map((w) => (
          <div key={w}>{w}</div>
        ))}
      </div>

      <div className="px-4 mt-1 grid grid-cols-7 gap-1">
        {cells.map((d, idx) => {
          if (!d) return <div key={idx} />;
          const key = `${viewYear}-${pad2(viewMonth + 1)}-${pad2(d)}`;
          const dayTasks = tasksByDate[key] || [];
          const isToday = key === dateToKey(today);
          const isSelected = key === selected;
          const statuses = Array.from(new Set(dayTasks.map((t) => getTaskStatus(t))));
          return (
            <button
              key={idx}
              onClick={() => setSelected(key)}
              className="aspect-square rounded-xl flex flex-col items-center justify-center relative"
              style={{
                background: isSelected ? theme.soft : "transparent",
                border: isToday ? `1.5px solid ${theme.primary}` : "1px solid transparent",
              }}
            >
              <span className="text-sm text-gray-700">{d}</span>
              <div className="flex gap-0.5 mt-0.5">
                {statuses.slice(0, 3).map((s) => (
                  <span key={s} className="w-1.5 h-1.5 rounded-full" style={{ background: STATUS[s].bar }} />
                ))}
              </div>
            </button>
          );
        })}
      </div>

      <div className="flex-1 overflow-y-auto px-4 mt-4 pb-2">
        <div className="text-sm font-bold text-gray-700 mb-2">
          งานวันที่ {formatThaiDateShort(selected)}
        </div>
        <div className="flex flex-col gap-2">
          {selectedTasks.length === 0 && (
            <div className="text-sm text-gray-400 text-center py-6">ไม่มีงานในวันที่เลือก</div>
          )}
          {selectedTasks.map((t) => (
            <TaskCard
              key={t.id}
              task={t}
              subject={subjectById[t.subjectId]}
              onToggle={onToggle}
              onEdit={onEdit}
              onDelete={onDelete}
            />
          ))}
        </div>
      </div>

      <BottomNav current={current} onNavigate={onNavigate} theme={theme} />
    </div>
  );
}

/* ------------------------------ Subjects ------------------------------ */

function SubjectModal({ theme, initial, existingSubjects, onSave, onClose }) {
  const [code, setCode] = useState(initial?.code || "");
  const [name, setName] = useState(initial?.name || "");
  const [color, setColor] = useState(initial?.color || SUBJECT_PALETTE[0]);
  const [error, setError] = useState("");
  const [show, setShow] = useState(false); // ควบคุมสถานะ enter/exit เพื่อ animate เข้า-ออกอย่างนุ่มนวล

  // เลื่อนเข้าเฟรมถัดไปหลัง mount เพื่อให้ transition ทำงาน (จาก 0 -> 1)
  useEffect(() => {
    const id = requestAnimationFrame(() => setShow(true));
    return () => cancelAnimationFrame(id);
  }, []);

  // ปิดแบบนุ่มนวล: เฟดออกก่อน แล้วค่อยเรียก callback จริงหลังเล่น transition จบ
  const dismiss = (after) => {
    setShow(false);
    setTimeout(after, 220);
  };

  const handleSave = () => {
    if (!code.trim() || !name.trim()) {
      setError("กรุณากรอกรหัสและชื่อวิชา");
      return;
    }
    const isDuplicate = (existingSubjects || []).some(
      (s) => s.id !== initial?.id && s.code.trim().toLowerCase() === code.trim().toLowerCase()
    );
    if (isDuplicate) {
      setError("มีรหัสวิชานี้อยู่แล้ว กรุณาใช้รหัสอื่น");
      return;
    }
    const subj = { id: initial?.id || uid(), code: code.trim(), name: name.trim(), color };
    dismiss(() => onSave(subj));
  };

  return (
    <div
      className="absolute inset-0 flex items-end z-40 transition-opacity duration-300 ease-out"
      style={{ background: "rgba(17,24,39,0.45)", opacity: show ? 1 : 0 }}
      onClick={() => dismiss(onClose)}
      role="presentation"
    >
      <div
        className="bg-white w-full rounded-t-3xl p-5 transition-transform duration-300 ease-out"
        style={{
          transform: show ? "translateY(0)" : "translateY(100%)",
          boxShadow: "0 -12px 34px rgba(17,24,39,0.18)",
        }}
        onClick={(e) => e.stopPropagation()}
        role="dialog"
        aria-modal="true"
      >
        <div className="mx-auto mb-3 h-1.5 w-10 rounded-full bg-gray-200" />
        <div className="flex items-center justify-between mb-3">
          <div className="font-bold text-gray-800">{initial ? "แก้ไขวิชา" : "เพิ่มวิชาใหม่"}</div>
          <button onClick={() => dismiss(onClose)} className="text-gray-400">
            <X size={20} />
          </button>
        </div>
        <label className="text-sm text-gray-500">รหัสวิชา</label>
        <input
          value={code}
          onChange={(e) => setCode(e.target.value)}
          placeholder="เช่น SQL101"
          className="w-full border border-gray-200 rounded-2xl p-3 mt-1 mb-3 focus:outline-none"
        />
        <label className="text-sm text-gray-500">ชื่อวิชา</label>
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="เช่น ฐานข้อมูล"
          className="w-full border border-gray-200 rounded-2xl p-3 mt-1 mb-3 focus:outline-none"
        />
        <label className="text-sm text-gray-500">สี</label>
        <div className="flex gap-2 mt-1 mb-4">
          {SUBJECT_PALETTE.map((c) => (
            <button
              key={c}
              onClick={() => setColor(c)}
              className="w-8 h-8 rounded-full"
              style={{ background: c, border: color === c ? "3px solid #111" : "3px solid transparent" }}
            />
          ))}
        </div>
        {error && <div className="text-xs text-red-500 mb-2">{error}</div>}
        <button
          onClick={handleSave}
          className="w-full py-3 rounded-2xl text-white font-semibold"
          style={{ background: `linear-gradient(135deg, ${theme.primary}, ${theme.dark})` }}
        >
          บันทึก
        </button>
      </div>
    </div>
  );
}

/* ------------------------------ Progress / Summary ------------------------------ */

function ProgressScreen({ theme, tasks, subjects, current, onNavigate }) {
  const [period, setPeriod] = useState("week"); // week | month | year
  const [subjectFilter, setSubjectFilter] = useState("all");

  const { start, end } = getPeriodRange(period);
  const inRange = (t) => {
    const due = new Date(`${t.dueDate}T${t.dueTime || "23:59"}:00`);
    return due >= start && due <= end;
  };

  const periodTasks = tasks.filter(inRange);
  const filteredTasks = subjectFilter === "all" ? periodTasks : periodTasks.filter((t) => t.subjectId === subjectFilter);
  const doneTasks = filteredTasks.filter((t) => t.completed);
  const percent = filteredTasks.length ? Math.round((doneTasks.length / filteredTasks.length) * 100) : 0;

  const perSubject = subjects.map((s) => {
    const subjTasks = periodTasks.filter((t) => t.subjectId === s.id);
    const subjDone = subjTasks.filter((t) => t.completed);
    return {
      subject: s,
      total: subjTasks.length,
      done: subjDone.length,
      percent: subjTasks.length ? Math.round((subjDone.length / subjTasks.length) * 100) : 0,
    };
  }).filter((row) => row.total > 0);

  const archive = [...doneTasks].sort((a, b) => {
    const ad = a.completedAt || `${a.dueDate}T${a.dueTime || "23:59"}`;
    const bd = b.completedAt || `${b.dueDate}T${b.dueTime || "23:59"}`;
    return new Date(bd) - new Date(ad);
  });

  const subjectById = Object.fromEntries(subjects.map((s) => [s.id, s]));

  const periodLabel = { week: "สัปดาห์นี้", month: "เดือนนี้", year: "ปีนี้" };

  return (
    <div className="flex flex-col h-full">
      <GradientHeader theme={theme} title="📊 ความคืบหน้า" subtitle="ดูสถิติการทำงานของคุณย้อนหลัง" mood="neutral" />

function SettingsScreen({

  const [uploading, setUploading] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const fileInputRef = useRef(null);

  const handlePickPhoto = () => {
    fileInputRef.current?.click();
  };

  const handlePhotoChange = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = ""; // เผื่อเลือกไฟล์เดิมซ้ำครั้งถัดไปก็ยังทริกเกอร์ change
    if (!file) return;

    }
    setUploadError("");
    setUploading(true);

      const dataUrl = await resizeImageFile(file);

      setUploading(false);

            <div className="flex-1">
              {editing ? (
                <input
                  value={name}
                  onChange={(e) => setName(e.target.value)}

                <div className="font-semibold text-gray-800">{profile?.name}</div>

              <div className="text-xs text-gray-400 mt-0.5">{profile?.email}</div>
            </div>
            <button
              onClick={() => {
                if (editing) onProfileSave({ ...profile, name: name.trim() || profile.name });
                setEditing((v) => !v);
              }}
              className="text-sm font-semibold px-3 py-1.5 rounded-xl"
              style={{ color: theme.primary, background: theme.soft }}

          <div className="flex items-center gap-2 text-gray-700 text-sm font-semibold">
            {darkMode ? "🌙" : "☀️"} โหมดมืด
          </div>
          <button
            onClick={onToggleDarkMode}
            className="w-11 h-6 rounded-full relative transition-colors"
            style={{ background: darkMode ? theme.primary : "#E5E7EB" }}
          >

              className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all"

/* ================================ App root ================================ */

function DeadHootApp() {
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [subjects, setSubjects] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [themeKey, setThemeKey] = useState("purple");
  const [notifications, setNotifications] = useState(true);
  const [darkMode, setDarkMode] = useState(false);

  const [screen, setScreen] = useState("welcome");
  const [editingTask, setEditingTask] = useState(null);
  const [toast, setToast] = useState("");

  const [email, setEmail] = useState("");
  const [emailError, setEmailError] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [signupError, setSignupError] = useState("");
  const [loginError, setLoginError] = useState("");
  const [otpInput, setOtpInput] = useState("");
  const [otpError, setOtpError] = useState("");
  const [resendCooldown, setResendCooldown] = useState(0);
  const [authLoading, setAuthLoading] = useState(false);
  const [nameInput, setNameInput] = useState("");
  const [nameError, setNameError] = useState("");
  const [isPasswordReset, setIsPasswordReset] = useState(false);
  const [newPassword, setNewPassword] = useState("");
  const [confirmNewPassword, setConfirmNewPassword] = useState("");
  const [resetPasswordError, setResetPasswordError] = useState("");

  const theme = THEMES[themeKey];

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2000);
  }, []);

  // เช็คงานใกล้ครบกำหนดทุก 1 นาที แล้วส่ง Notification จริงเข้าอุปกรณ์
  // (ทำงานได้เฉพาะตอนเปิดแท็บ/เบราว์เซอร์นี้อยู่ — ปิดเบราว์เซอร์ไปเลยจะไม่มีการแจ้งเตือน
  //  เพราะการแจ้งเตือนแบบปิดแอปสนิทแล้วยังเด้งได้ต้องมี Push Server แยกต่างหาก)
  useEffect(() => {
    if (!notifications || typeof Notification === "undefined") return;
    const checkReminders = () => {
      if (Notification.permission !== "granted") return;
      const now = new Date();
      tasks.forEach((t) => {
        if (t.completed) return;
        const due = new Date(`${t.dueDate}T${t.dueTime || "23:59"}:00`);
        const diffDays = (due - now) / (1000 * 60 * 60 * 24);
        (t.remind || []).forEach((d) => {
          if (diffDays <= d && diffDays > 0) {
            const notifiedKey = `deadhoot_notified:${t.id}:${d}`;
            if (localStorage.getItem(notifiedKey)) return;
            try {
              new Notification("🦉 DeadHoot เตือนความจำ", {
                body: `"${t.title}" ใกล้ครบกำหนดแล้ว (เหลืออีก ${d} วัน)`,
              });
              localStorage.setItem(notifiedKey, "1");
            } catch (e) {
              console.error("แจ้งเตือนไม่สำเร็จ", e);
            }
          }
        });
      });
    };
    checkReminders();
    const interval = setInterval(checkReminders, 60000);
    return () => clearInterval(interval);
  }, [tasks, notifications]);

  // นับถอยหลังก่อนกดส่งรหัส OTP ซ้ำได้อีกครั้ง
  useEffect(() => {
    if (resendCooldown <= 0) return;
    const t = setTimeout(() => setResendCooldown((c) => c - 1), 1000);
    return () => clearTimeout(t);
  }, [resendCooldown]);

  useEffect(() => {
    (async () => {
      const savedEmail = getLocalEmail();
      if (!savedEmail) {
        setScreen("welcome");
        setLoading(false);
        return;
      }
      const p = await storageGet(profileKeyFor(savedEmail));
      const d = await storageGet(dataKeyFor(savedEmail));
      if (p && p.onboarded) {
        setProfile(p);
        setSubjects(d?.subjects || []);
        setTasks(d?.tasks || []);
        setThemeKey(d?.theme || "purple");
        setNotifications(d?.notifications ?? true);
        setDarkMode(d?.darkMode ?? false);
        setScreen("home");
      } else {
        setScreen("welcome");
      }
      setLoading(false);
    })();
  }, []);

  const persistData = useCallback(
    (patch) => {
      const targetEmail = profile?.email || getLocalEmail();
      if (!targetEmail) return;
      const next = {
        subjects: patch.subjects ?? subjects,
        tasks: patch.tasks ?? tasks,
        theme: patch.theme ?? themeKey,
        notifications: patch.notifications ?? notifications,
        darkMode: patch.darkMode ?? darkMode,
      };
      storageSet(dataKeyFor(targetEmail), next);
    },
    [profile, subjects, tasks, themeKey, notifications, darkMode]
  );

  const handleLogin = async () => {
    if (!password) {
      setLoginError("กรุณากรอกรหัสผ่าน");
      return;
    }
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    if (!valid) {
      setLoginError("กรุณากรอกอีเมลให้ถูกต้อง");
      return;
    }
    setLoginError("");
    setAuthLoading(true);
    try {
      const cleanEmail = email.trim();
      const result = await callServer("loginUser", cleanEmail, password);
      if (!result.success) {
        setLoginError(result.message || "เข้าสู่ระบบไม่สำเร็จ");
        return;
      }
      const d = await storageGet(dataKeyFor(cleanEmail));
      setLocalEmail(cleanEmail);
      setProfile(result.profile);
      setSubjects(d?.subjects || []);
      setTasks(d?.tasks || []);
      setThemeKey(d?.theme || "purple");
      setNotifications(d?.notifications ?? true);
        setDarkMode(d?.darkMode ?? false);
      setPassword("");
      setScreen("home");
    } catch (e) {
      setLoginError("เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setAuthLoading(false);
    }
  };

  const handleSignupNext = async () => {
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    if (!valid) {
      setSignupError("กรุณากรอกอีเมลให้ถูกต้อง");
      return;
    }
    if (password.length < 6) {
      setSignupError("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");
      return;
    }
    if (password !== confirmPassword) {
      setSignupError("รหัสผ่านทั้งสองช่องไม่ตรงกัน");
      return;
    }
    setSignupError("");
    setAuthLoading(true);
    try {
      const cleanEmail = email.trim();
      const exists = await callServer("checkEmailExists", cleanEmail);
      if (exists) {
        setSignupError("อีเมลนี้เคยสมัครแล้ว กรุณาเข้าสู่ระบบแทน");
        return;
      }
      await callServer("sendOtpEmail", cleanEmail);
      setOtpInput("");
      setOtpError("");
      setResendCooldown(30);
      setIsPasswordReset(false);
      setScreen("otp");
    } catch (e) {
      setSignupError("ส่งอีเมลไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setAuthLoading(false);
    }
  };

  const handleResendOtp = async () => {
    if (resendCooldown > 0) return;
    try {
      await callServer("sendOtpEmail", email.trim());
      setOtpInput("");
      setResendCooldown(30);
      showToast("ส่งรหัสใหม่แล้ว เช็คอีเมลของคุณ");
    } catch (e) {
      showToast("ส่งไม่สำเร็จ ลองใหม่อีกครั้ง");
    }
  };

  const handleVerifyOtp = async () => {
    setAuthLoading(true);
    try {
      const ok = await callServer("verifyOtpCode", email.trim(), otpInput);
      if (!ok) {
        setOtpError("รหัสไม่ถูกต้องหรือหมดอายุแล้ว");
        return;
      }
      setOtpError("");
      if (isPasswordReset) {
        setNewPassword("");
        setConfirmNewPassword("");
        setResetPasswordError("");
        setScreen("reset-password");
      } else {
        setNameInput("");
        setNameError("");
        setScreen("profile-setup");
      }
    } catch (e) {
      setOtpError("ตรวจสอบไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setAuthLoading(false);
    }
  };

  const handleForgotPassword = async () => {
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    if (!valid) {
      setLoginError("กรุณากรอกอีเมลก่อนกดลืมรหัสผ่าน");
      return;
    }
    setLoginError("");
    setAuthLoading(true);
    try {
      const cleanEmail = email.trim();
      const exists = await callServer("checkEmailExists", cleanEmail);
      if (!exists) {
        setLoginError("ไม่พบบัญชีนี้");
        return;
      }
      await callServer("sendOtpEmail", cleanEmail);
      setOtpInput("");
      setOtpError("");
      setResendCooldown(30);
      setIsPasswordReset(true);
      setScreen("otp");
    } catch (e) {
      setLoginError("เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setAuthLoading(false);
    }
  };

  const handleResetPassword = async () => {
    if (newPassword.length < 6) {
      setResetPasswordError("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");
      return;
    }
    if (newPassword !== confirmNewPassword) {
      setResetPasswordError("รหัสผ่านทั้งสองช่องไม่ตรงกัน");
      return;
    }
    setResetPasswordError("");
    setAuthLoading(true);
    const cleanEmail = email.trim();
    try {
      const result = await callServer("resetPassword", cleanEmail, newPassword);
      if (!result.success) {
        setResetPasswordError(result.message || "เปลี่ยนรหัสผ่านไม่สำเร็จ");
        return;
      }
      const d = await storageGet(dataKeyFor(cleanEmail));
      setLocalEmail(cleanEmail);
      setProfile(result.profile);
      setSubjects(d?.subjects || []);
      setTasks(d?.tasks || []);
      setThemeKey(d?.theme || "purple");
      setNotifications(d?.notifications ?? true);
        setDarkMode(d?.darkMode ?? false);
      setIsPasswordReset(false);
      setNewPassword("");
      setConfirmNewPassword("");
      setPassword("");
      showToast("ตั้งรหัสผ่านใหม่สำเร็จ");
      setScreen("home");
    } catch (e) {
      setResetPasswordError("เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setAuthLoading(false);
    }
  };

  const handleFinishProfile = async () => {
    if (!nameInput.trim()) {
      setNameError("กรุณากรอกชื่อของคุณ");
      return;
    }
    setNameError("");
    setAuthLoading(true);
    const cleanEmail = email.trim();
    try {
      const newProfile = await callServer("registerUser", cleanEmail, nameInput.trim(), password);
      const seedSubjects = defaultSubjects();
      const seedTasks = defaultTasks(seedSubjects);
      await storageSet(dataKeyFor(cleanEmail), { subjects: seedSubjects, tasks: seedTasks, theme: themeKey, notifications: true });
      setLocalEmail(cleanEmail);
      setProfile(newProfile);
      setSubjects(seedSubjects);
      setTasks(seedTasks);
      setPassword("");
      setConfirmPassword("");
      setScreen("home");
    } catch (e) {
      setNameError("สมัครสมาชิกไม่สำเร็จ ลองใหม่อีกครั้ง");
    } finally {
      setAuthLoading(false);
    }
  };

  const handleToggleTask = (id) => {
    const next = tasks.map((t) =>
      t.id === id
        ? { ...t, completed: !t.completed, completedAt: !t.completed ? new Date().toISOString() : null }
        : t
    );
    setTasks(next);
    persistData({ tasks: next });
  };

  const handleDeleteTask = (id) => {
    if (!window.confirm("ต้องการลบงานนี้ใช่หรือไม่? เมื่อลบแล้วจะกู้คืนไม่ได้")) return;
    const next = tasks.filter((t) => t.id !== id);
    setTasks(next);
    persistData({ tasks: next });
    showToast("ลบงานแล้ว");
  };

  const handleEditTask = (task) => {
    setEditingTask(task);
    setScreen("add-task");
  };

  const handleSaveTask = (task) => {
    const exists = tasks.some((t) => t.id === task.id);
    const next = exists ? tasks.map((t) => (t.id === task.id ? task : t)) : [...tasks, task];
    setTasks(next);
    persistData({ tasks: next });
    setEditingTask(null);
    if (exists) {
      showToast("แก้ไขงานแล้ว");
      setScreen("home");
    } else {
      setScreen("result");
    }
  };

  const handleSaveSubject = (subj) => {
    const exists = subjects.some((s) => s.id === subj.id);
    const duplicate = subjects.some(
      (s) => s.id !== subj.id && s.code.trim().toLowerCase() === subj.code.trim().toLowerCase()
    );
    if (duplicate) {
      return "มีรหัสวิชานี้อยู่แล้ว กรุณาใช้รหัสอื่น";
    }
    const next = exists ? subjects.map((s) => (s.id === subj.id ? subj : s)) : [...subjects, subj];
    setSubjects(next);
    persistData({ subjects: next });
    showToast(exists ? "แก้ไขวิชาแล้ว" : "เพิ่มวิชาแล้ว");
    return null;
  };

  const handleDeleteSubject = (id) => {
    if (!window.confirm("ต้องการลบวิชานี้ใช่หรือไม่? งานที่ผูกกับวิชานี้จะถูกลบไปด้วย")) return;
    const nextSubjects = subjects.filter((s) => s.id !== id);
    const nextTasks = tasks.filter((t) => t.subjectId !== id);
    setSubjects(nextSubjects);
    setTasks(nextTasks);
    persistData({ subjects: nextSubjects, tasks: nextTasks });
    showToast("ลบวิชาแล้ว");
  };

  const handleThemeChange = (key) => {
    setThemeKey(key);
    persistData({ theme: key });
  };

  const handleToggleNotifications = async () => {
    const next = !notifications;
    if (next && typeof Notification !== "undefined") {
      if (Notification.permission === "default") {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          showToast("ต้องอนุญาตการแจ้งเตือนในเบราว์เซอร์ก่อนถึงจะใช้งานได้");
          return;
        }
      } else if (Notification.permission === "denied") {
        showToast("การแจ้งเตือนถูกปิดไว้ในเบราว์เซอร์ กรุณาไปเปิดในตั้งค่าเบราว์เซอร์ก่อน");
        return;
      }
    }
    setNotifications(next);
    persistData({ notifications: next });
  };

  const handleToggleDarkMode = () => {
    const next = !darkMode;
    setDarkMode(next);
    persistData({ darkMode: next });
  };

  const handleProfileSave = async (p) => {
    setProfile(p);
    await storageSet(profileKeyFor(p.email), p);
    showToast("บันทึกโปรไฟล์แล้ว");
  };

  const handleLogout = async () => {
    // แค่ลืมอีเมลที่จำไว้ในเครื่องนี้ ข้อมูลในชีทของผู้ใช้ยังอยู่ครบ
    // ล็อกอินด้วยอีเมลเดิมใหม่เมื่อไหร่ก็ได้ข้อมูลกลับคืนมาทั้งหมด
    clearLocalEmail();
    setProfile(null);
    setSubjects([]);
    setTasks([]);
    setEmail("");
    setPassword("");
    setConfirmPassword("");
    setNameInput("");
    setScreen("welcome");
  };

  return (
    <div className="phone-shell w-full min-h-screen flex items-center justify-center py-6" style={{ background: "#F3F1FB" }}>
      <div
        className={`phone-frame relative bg-white flex flex-col${darkMode ? " dark" : ""}`}
        style={{ width: 390, height: 844, borderRadius: 28, boxShadow: "0 20px 60px rgba(76,63,207,0.15)", overflow: "hidden" }}
      >
        <PhoneClock />
        <div className="flex-1 min-h-0 flex flex-col pb-1">
          {loading && (
            <div className="flex-1 flex items-center justify-center">
              <OwlAvatar mood="neutral" size={64} />
            </div>
          )}

          {!loading && screen === "welcome" && (
            <WelcomeScreen theme={theme} onLogin={() => { setLoginError(""); setPassword(""); setScreen("login"); }} onSignup={() => { setSignupError(""); setPassword(""); setConfirmPassword(""); setScreen("signup"); }} />
          )}

          {!loading && screen === "login" && (
            <LoginScreen
              theme={theme}
              email={email}
              setEmail={setEmail}
              password={password}
              setPassword={setPassword}
              onSubmit={handleLogin}
              onBack={() => setScreen("welcome")}
              onForgotPassword={handleForgotPassword}
              error={loginError}
              loading={authLoading}
            />
          )}

          {!loading && screen === "reset-password" && (
            <ResetPasswordScreen
              theme={theme}
              email={email}
              password={newPassword}
              setPassword={setNewPassword}
              confirmPassword={confirmNewPassword}
              setConfirmPassword={setConfirmNewPassword}
              onSubmit={handleResetPassword}
              error={resetPasswordError}
              loading={authLoading}
            />
          )}

          {!loading && screen === "signup" && (
            <SignupEmailScreen
              theme={theme}
              email={email}
              setEmail={setEmail}
              password={password}
              setPassword={setPassword}
              confirmPassword={confirmPassword}
              setConfirmPassword={setConfirmPassword}
              onNext={handleSignupNext}
              onBack={() => setScreen("welcome")}
              error={signupError}
              loading={authLoading}
            />
          )}

          {!loading && screen === "otp" && (
            <OtpScreen
              theme={theme}
              email={email}
              otpInput={otpInput}
              setOtpInput={setOtpInput}
              onVerify={handleVerifyOtp}
              onResend={handleResendOtp}
              error={otpError}
              loading={authLoading}
              resendCooldown={resendCooldown}
            />
          )}

          {!loading && screen === "profile-setup" && (
            <ProfileSetupScreen theme={theme} name={nameInput} setName={setNameInput} onFinish={handleFinishProfile} error={nameError} loading={authLoading} />
          )}

          {!loading && screen === "home" && (
            <HomeScreen
              theme={theme}
              profile={profile}
              tasks={tasks}
              subjects={subjects}
              onToggle={handleToggleTask}
              onEdit={handleEditTask}
              onDelete={handleDeleteTask}
              onAdd={() => {
                setEditingTask(null);
                setScreen("add-task");
              }}
              current="home"
              onNavigate={setScreen}
            />
          )}

          {!loading && screen === "add-task" && (
            <AddTaskScreen
              theme={theme}
              subjects={subjects}
              initial={editingTask}
              onSave={handleSaveTask}
              onCancel={() => {
                setEditingTask(null);
                setScreen("home");
              }}
            />
          )}

          {!loading && screen === "result" && (
            <ResultScreen
              theme={theme}
              tasks={tasks}
              subjects={subjects}
              onViewCalendar={() => setScreen("calendar")}
              onViewProgress={() => setScreen("progress")}
              onBackHome={() => setScreen("home")}
            />
          )}

          {!loading && screen === "calendar" && (
            <CalendarScreen
              theme={theme}
              tasks={tasks}
              subjects={subjects}
              onToggle={handleToggleTask}
              onEdit={handleEditTask}
              onDelete={handleDeleteTask}
              current="calendar"
              onNavigate={setScreen}
            />
          )}

          {!loading && screen === "subjects" && (
            <SubjectsScreen
              theme={theme}
              subjects={subjects}
              tasks={tasks}
              onSave={handleSaveSubject}
              onDelete={handleDeleteSubject}
              current="subjects"
              onNavigate={setScreen}
            />
          )}

          {!loading && screen === "progress" && (
            <ProgressScreen theme={theme} tasks={tasks} subjects={subjects} current="progress" onNavigate={setScreen} />
          )}

          {!loading && screen === "settings" && (
            <SettingsScreen
              theme={theme}
              themeKey={themeKey}
              onThemeChange={handleThemeChange}
              profile={profile}
              onProfileSave={handleProfileSave}
              notifications={notifications}
              onToggleNotifications={handleToggleNotifications}
              darkMode={darkMode}
              onToggleDarkMode={handleToggleDarkMode}
              onLogout={handleLogout}
              current="settings"
              onNavigate={setScreen}
            />
          )}

        </div>

        <Toast message={toast} />
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<DeadHootApp />);
</script>
</body>
</html>
